name: Go Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
      id: go
    - name: Test
      # -race is required, not a nicety: the tests covering shared spec
      # state across concurrent createInstance calls and the parallel
      # Decrease/cleanupPorts teardown pass either way without it, and only
      # report their bug under the race detector.
      run: go test -race -v ./...
