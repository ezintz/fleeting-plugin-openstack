name: Go Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pin the minor version so CI and local runs agree on which checks
        # exist; the action still resolves the newest patch release itself.
        # Linter and formatter selection lives in .golangci.yml.
        version: v2.12
